<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus 360 View</title>
  <!-- Include Three.js and Panolens -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.105.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/panolens@0.12.0/build/panolens.min.js"></script>
  <link rel="stylesheet" href="static/styles/style.css" />
  <style>
    /* Navigation Container */
    #nav-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 150px;
      height: 150px;
      z-index: 100;
    }

    /* Navigation Button Styling */
    .nav-button {
      position: absolute;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      padding: 10px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .nav-button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }
    .nav-button:active {
      transform: scale(0.9);
    }

    /* Diamond layout */
    .nav-button.forward { top: 0; left: 50%; transform: translateX(-50%); }
    .nav-button.back { bottom: 0; left: 50%; transform: translateX(-50%); }
    .nav-button.left { top: 50%; left: 0; transform: translateY(-50%); }
    .nav-button.right { top: 50%; right: 0; transform: translateY(-50%); }

    /* Fullscreen Button */
    .fullscreen-button {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 101;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      padding: 10px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .fullscreen-button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }
    .fullscreen-button:active {
      transform: scale(0.9);
    }

    /* Location Label */
    #location-label {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      z-index: 102;
      #location-dropdown select {
  background-color: #333;
  color: white;
  padding: 5px;
  border: 1px solid #444;
  border-radius: 5px;
}

#location-dropdown {
  font-family: Arial, sans-serif;
}

    }
  </style>
</head>
<body>
  <!-- Viewer container (required for Panolens) -->
  <div id="viewer" style="width: 100%; height: 100vh;"></div>

  <!-- Location Label -->
  <div id="location-label">Entrance</div>

  <!-- Navigation buttons container -->
  <div id="nav-container">
    <button class="nav-button forward" onclick="navigate('forward')">&uarr;</button>
    <button class="nav-button back" onclick="navigate('back')">&darr;</button>
    <button class="nav-button left" onclick="navigate('left')">&larr;</button>
    <button class="nav-button right" onclick="navigate('right')">&rarr;</button>
  </div>
  
<!-- Dropdown Menu -->
<div id="location-dropdown" style="position: absolute; top: 10px; left: 10px; background-color: rgba(0, 0, 0, 0.7); color: white; padding: 10px; border-radius: 5px;">
  <label for="location-select">Choose a location:</label>
  <select id="location-select">
    <option value="0">Entrance</option>
    <option value="13">Pecock Circle</option>
    <option value="14">Canteen</option>
    <option value="7">Starting Area Of Grand Portigo</option>
    <option value="10">T Junction</option>
    <!-- Add more locations as needed -->
  </select>
</div>

  <!-- Fullscreen mode button -->
  <button class="fullscreen-button" id="fullscreenToggle">&#x26F6;</button>

  <!-- Load navigation script -->
  <script src="static/scripts/navigation.js"></script>
  <script>
    // Fullscreen toggle functionality
    const fullscreenBtn = document.getElementById('fullscreenToggle');
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
        });
      } else {
        document.exitFullscreen();
      }
    });

    // Update the fullscreen button icon based on the state
    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        fullscreenBtn.innerHTML = '&#x2715;'; // 'X' icon when in fullscreen
      } else {
        fullscreenBtn.innerHTML = '&#x26F6;'; // Fullscreen icon when not fullscreen
      }
    });
  </script>
</body>
</html>
